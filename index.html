<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIM Demos</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root { --olive: #969300; --olive-50: #F5F5E6; --raisin: #262633; --t2: #54545D; --border: #DFDFE1; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font: 400 14px/20px Roboto, system-ui, sans-serif; color: var(--raisin); background: #F7F7F7; display: flex; flex-direction: column; }
header { height: 64px; background: var(--raisin); color: #fff; display: flex; align-items: center; padding: 0 24px; font-weight: 500; font-size: 18px; gap: 12px; }
header i { width: 28px; height: 28px; border-radius: 6px; background: var(--olive); }
main { flex: 1; display: grid; place-content: center; padding: 32px 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 320px)); gap: 24px; }
a.card { display: flex; flex-direction: column; gap: 8px; padding: 24px; background: #fff; border: 1px solid var(--border); border-radius: 8px; color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--olive); background: var(--olive-50); }
.card .ms { font-family: 'Material Icons'; font-size: 32px; color: var(--olive); }
.card b { font-weight: 500; font-size: 18px; }
.card span { color: var(--t2); }
</style>
</head>
<body>
<header><i></i>LIM</header>
<main>
  <div class="cards">
    <a class="card" href="planning/single-line.html"><span class="ms">event_note</span><b>Planning</b><span>Gantt chart and activity details</span></a>
    <a class="card" href="site/"><span class="ms">layers_clear</span><b>Site</b><span>Add a zone shape and link activities</span></a>
  </div>
</main>
</body>
</html>
